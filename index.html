<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOAD - 掲示板兼ネットラジオ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="container">
                <h1 class="logo">🎙️ BOAD</h1>
                <div class="nav-menu">
                    <button id="navHome" class="nav-link active">ホーム</button>
                    <button id="navRadio" class="nav-link">ラジオ</button>
                    <button id="navBoard" class="nav-link">掲示板</button>
                    <button id="navProfile" class="nav-link">プロフィール</button>
                    <button id="navLogout" class="nav-link logout-btn" style="display: none;">ログアウト</button>
                    <button id="navLogin" class="nav-link login-btn">ログイン</button>
                </div>
            </div>
        </nav>

        <!-- ホームページ -->
        <section id="homePage" class="page active">
            <div class="container">
                <div class="hero">
                    <h2>掲示板兼ネットラジオプラットフォーム</h2>
                    <p>ラジオを主催したり、コメントしたり、掲示板に書き込みができます</p>
                    <div class="hero-buttons">
                        <button id="getStarted" class="btn btn-primary">はじめる</button>
                        <button id="viewDemo" class="btn btn-secondary">デモを見る</button>
                    </div>
                </div>

                <div class="features">
                    <div class="feature-card">
                        <div class="icon">🎙️</div>
                        <h3>ラジオ配信</h3>
                        <p>気軽にラジオを主催できます</p>
                    </div>
                    <div class="feature-card">
                        <div class="icon">💬</div>
                        <h3>リアルタイムコメント</h3>
                        <p>配信中にリアルタイムでコメントできます</p>
                    </div>
                    <div class="feature-card">
                        <div class="icon">📝</div>
                        <h3>掲示板</h3>
                        <p>コミュニティで情報を共有できます</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- ログインページ -->
        <section id="loginPage" class="page modal">
            <div class="modal-content">
                <button class="close-btn">&times;</button>
                <h2>ログイン</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label>ユーザーID</label>
                        <input type="text" id="loginId" required>
                    </div>
                    <div class="form-group">
                        <label>パスワード</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary">ログイン</button>
                    <p class="form-footer">
                        アカウントがない方は<button type="button" id="switchToRegister" class="link-btn">こちら</button>
                    </p>
                </form>
            </div>
        </section>

        <!-- 登録ページ -->
        <section id="registerPage" class="page modal">
            <div class="modal-content">
                <button class="close-btn">&times;</button>
                <h2>アカウント作成</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label>ユーザーID</label>
                        <input type="text" id="registerId" required>
                        <small id="idMessage"></small>
                    </div>
                    <div class="form-group">
                        <label>パスワード</label>
                        <input type="password" id="registerPassword" required>
                    </div>
                    <div class="form-group">
                        <label>パスワード（確認）</label>
                        <input type="password" id="registerPasswordConfirm" required>
                        <small id="passwordMessage"></small>
                    </div>
                    <button type="submit" class="btn btn-primary">登録</button>
                    <p class="form-footer">
                        アカウントがある方は<button type="button" id="switchToLogin" class="link-btn">こちら</button>
                    </p>
                </form>
            </div>
        </section>

        <!-- ラジオページ -->
        <section id="radioPage" class="page">
            <div class="container">
                <h2>ネットラジオ</h2>
                
                <!-- ラジオ主催フォーム -->
                <div id="hostRadioForm" class="card" style="display: none;">
                    <h3>ラジオを主催する</h3>
                    <form id="createRadioForm">
                        <div class="form-group">
                            <label>番組名</label>
                            <input type="text" id="radioTitle" placeholder="例: 夜の雑談ラジオ" required>
                        </div>
                        <div class="form-group">
                            <label>説明</label>
                            <textarea id="radioDescription" placeholder="番組の説明" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <label>タグ</label>
                            <input type="text" id="radioTags" placeholder="例: 雑談,相談,音楽">
                        </div>
                        <button type="submit" class="btn btn-primary">配信を開始</button>
                    </form>
                </div>

                <!-- ラジオリスト -->
                <div id="radioList" class="radio-grid">
                    <!-- 配信一覧がここに表示される -->
                </div>
            </div>
        </section>

        <!-- 掲示板ページ -->
        <section id="boardPage" class="page">
            <div class="container">
                <h2>掲示板</h2>
                
                <!-- スレッド作成フォーム -->
                <div id="createThreadForm" class="card" style="display: none;">
                    <h3>新しいスレッドを作成</h3>
                    <form id="threadForm">
                        <div class="form-group">
                            <label>タイトル</label>
                            <input type="text" id="threadTitle" placeholder="スレッドのタイトル" required>
                        </div>
                        <div class="form-group">
                            <label>内容</label>
                            <textarea id="threadContent" placeholder="内容を入力" rows="4" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>カテゴリ</label>
                            <select id="threadCategory">
                                <option value="general">雑談</option>
                                <option value="question">質問</option>
                                <option value="announcement">お知らせ</option>
                                <option value="other">その他</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">投稿</button>
                    </form>
                </div>

                <!-- スレッドリスト -->
                <div id="threadList" class="thread-list">
                    <!-- スレッド一覧がここに表示される -->
                </div>
            </div>
        </section>

        <!-- プロフィールページ -->
        <section id="profilePage" class="page">
            <div class="container">
                <h2>プロフィール</h2>
                <div id="profileContent" class="card">
                    <!-- プロフィール情報がここに表示される -->
                </div>
            </div>
        </section>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/radio.js"></script>
    <script src="js/board.js"></script>
    <script src="js/comment.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
